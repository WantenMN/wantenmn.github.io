<p>文字让我轻松改进自己的想法，因为对文字的优化，就是对想法的优化。</p>
<p>文字减少了我的思考负担，一边思考，一边记录，审视自己的思路，避免忽略重要细节。</p>
<p>文字输入很方便，无论在手机还是电脑上，都能轻松输入；编辑器数量繁多，输入方式多样——触屏、键盘、语音识别都可以使用。</p>
<p>文字能长时间保存，只要载体存在，文字便不会轻易消失。</p>
<p>文字空间占用小，便于传输和存储。</p></section><div data-orientation="horizontal" role="none" data-slot="separator-root" class="my-4 h-px w-full dark:bg-border shrink-0 bg-zinc-100 data-[orientation=horizontal]:h-px data-[orientation=horizontal]:w-full data-[orientation=vertical]:h-full data-[orientation=vertical]:w-px mt-10 mb-8"></div><nav aria-label="Post navigation" class="mb-8"><div class="grid gap-3 sm:grid-cols-2"><a aria-label="Go to newer post: 最好用的视频倍速脚本" class="group border-border hover:bg-accent flex min-h-16 items-center gap-3 rounded-lg border px-4 py-3 no-underline transition-colors" href="/2026/03/17/1132"><span aria-hidden="true" class="text-muted-foreground group-hover:text-foreground text-lg transition-colors">&lt;</span><span class="text-foreground text-sm font-medium">最好用的视频倍速脚本</span></a><a aria-label="Go to older post: 在 Archlinux 上运行网易云音乐" class="group border-border hover:bg-accent flex min-h-16 items-center justify-end gap-3 rounded-lg border px-4 py-3 text-right no-underline transition-colors" href="/2026/01/26/1919"><span class="text-foreground text-sm font-medium">在 Archlinux 上运行网易云音乐</span><span aria-hidden="true" class="text-muted-foreground group-hover:text-foreground text-lg transition-colors">&gt;</span></a></div></nav><div data-orientation="horizontal" role="none" data-slot="separator-root" class="my-4 h-px w-full dark:bg-border shrink-0 bg-zinc-100 data-[orientation=horizontal]:h-px data-[orientation=horizontal]:w-full data-[orientation=vertical]:h-full data-[orientation=vertical]:w-px"></div><section class="giscus"></section></article><script>(function(a,f){let l;try{l=JSON.parse(sessionStorage.getItem(a)||"{}")}catch{return}const n=l?.[f||history.state?.__TSR_key];let c=!1;for(const t in n){const e=n[t],o=e?.scrollX,s=e?.scrollY;if(Number.isFinite(o)&&Number.isFinite(s)){if(t==="window")scrollTo(o,s),c=!0;else if(t)try{const r=document.querySelector(t);r&&(r.scrollLeft=o,r.scrollTop=s)}catch{}}}if(c)return;const i=location.hash.slice(1);if(i){
